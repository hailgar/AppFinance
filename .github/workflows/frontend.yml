name: Frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check:native
      - run: node --test ../scripts/tests/check_expo_native_versions.test.cjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install isolated UI preview dependencies
        run: npm ci
        working-directory: mobile/preview
      - name: Build UI preview from application screens
        run: npm run build:standalone
        working-directory: mobile/preview
      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: catat-harian-ui-preview
          path: mobile/preview/dist/
          if-no-files-found: error
          retention-days: 7
